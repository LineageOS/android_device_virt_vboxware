function set_kernel_cmdline_dynamic_device_specific {
	load_env -f ${partition_persist}/grubenv serial_console_function

	set kernel_cmdline_dynamic_device_specific=

	if [ "$serial_console_function" = "disable" ]; then
		true # nothing
	elif [ "$serial_console_function" = "console" ]; then
		set kernel_cmdline_dynamic_device_specific="${kernel_cmdline_dynamic_device_specific} androidboot.console=ttyS0"
	elif [ "$serial_console_function" = "console_in_ramdisk" ]; then
		set kernel_cmdline_dynamic_device_specific="${kernel_cmdline_dynamic_device_specific} androidboot.first_stage_console=1 console=ttyS0"
	elif [ "$serial_console_function" = "dmesg" ]; then
		set kernel_cmdline_dynamic_device_specific="${kernel_cmdline_dynamic_device_specific} console=ttyS0"
	elif [ "$serial_console_function" = "logcat" ]; then
		set kernel_cmdline_dynamic_device_specific="${kernel_cmdline_dynamic_device_specific} androidboot.seriallogging=ttyS0"
	else
		# Same as "console"
		set kernel_cmdline_dynamic_device_specific="${kernel_cmdline_dynamic_device_specific} androidboot.console=ttyS0"
	fi
}

# Unfortunately, 3D acceleration in VirtualBox has rendering issues.
insmod smbios
smbios --get-string=05 --set smbios_product_name
if [ "$smbios_product_name" = "VirtualBox" ]; then
    if [ "$default" != "1" ]; then
        set default="advancedoptions-vboxware>android-vboxware-no3daccel_swiftshader"
    fi
fi

submenu 'Advanced options' --class format-list-bulleted --id advancedoptions-vboxware {
#SUPPORT_MESA_SWRAST#	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Headless mode, Mesa swrast graphics)" --id android-vboxware-headless_mesaswrast {
#SUPPORT_MESA_SWRAST#		set_android_default "advancedoptions-vboxware>android-vboxware-headless_mesaswrast"
#SUPPORT_MESA_SWRAST#		boot_android vmwgfx.androidboot.gpu=vkms androidboot.graphics=mesa_swrast androidboot.insecure_adb=1
#SUPPORT_MESA_SWRAST#	}

	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Headless mode, Swiftshader graphics)" --id android-vboxware-headless_swiftshader {
		set_android_default "advancedoptions-vboxware>android-vboxware-headless_swiftshader"
		boot_android androidboot.gpu=vkms androidboot.graphics=swiftshader androidboot.insecure_adb=1
	}

#SUPPORT_MESA_SWRAST#	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Without 3D acceleration, Mesa swrast graphics)" --id android-vboxware-no3daccel_mesaswrast {
#SUPPORT_MESA_SWRAST#		set_android_default "advancedoptions-vboxware>android-vboxware-no3daccel_mesaswrast"
#SUPPORT_MESA_SWRAST#		boot_android androidboot.graphics=mesa_swrast
#SUPPORT_MESA_SWRAST#	}

	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Without 3D acceleration, Swiftshader graphics)" --id android-vboxware-no3daccel_swiftshader {
		set_android_default "advancedoptions-vboxware>android-vboxware-no3daccel_swiftshader"
		boot_android androidboot.graphics=swiftshader
	}
}
